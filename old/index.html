<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="STEM Kerala is coming soon.">
  <title>STEM Kerala | Coming Soon</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #687386;
      --accent: #d94f43;
      --background: #fffaf8;
      --card: rgba(255, 255, 255, 0.88);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 15%, rgba(217, 79, 67, 0.10), transparent 30%),
        radial-gradient(circle at 88% 85%, rgba(217, 79, 67, 0.08), transparent 28%),
        var(--background);
    }

    .card {
      width: min(100%, 680px);
      padding: clamp(32px, 7vw, 64px) 24px;
      text-align: center;
      background: var(--card);
      border: 1px solid rgba(23, 32, 51, 0.08);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(23, 32, 51, 0.08);
    }

    .eyebrow {
      display: inline-block;
      margin: 0 0 22px;
      padding: 8px 13px;
      color: var(--accent);
      background: rgba(217, 79, 67, 0.09);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 72px);
      line-height: 1.05;
      letter-spacing: -0.055em;
    }

    h1 span {
      color: var(--accent);
    }

    .message {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 3vw, 21px);
      line-height: 1.6;
    }

    .contact {
      margin-top: 34px;
      color: var(--muted);
      font-size: 14px;
    }

    .contact a {
      color: var(--ink);
      font-weight: 700;
      text-decoration: none;
    }

    .contact a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    footer {
      margin-top: 44px;
      padding-top: 22px;
      border-top: 1px solid rgba(23, 32, 51, 0.09);
      color: var(--muted);
      font-size: 13px;
    }

    footer a {
      color: var(--ink);
      font-weight: 700;
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Something exciting is on the way</p>
    <h1>STEM <span>Kerala</span></h1>
    <p class="message">Coming Soon</p>

    <p class="contact">
      For enquiries:
      <a href="mailto:hello@tebinnovations.in">hello@tebinnovations.in</a>
    </p>

    <footer>
      Powered by
      <a href="https://www.tebinnovations.in/" target="_blank" rel="noopener noreferrer">
        TEB Innovations
      </a>
    </footer>
  </main>
</body>
</html>
